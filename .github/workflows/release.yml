name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG_NAME: ${{ inputs.tag || github.ref_name }}
  VERSION: ${{ inputs.tag || github.ref_name }}
  # Public Ed25519 key. The private issuer key stays offline and is never shipped.
  BITS_LICENSE_PUBKEY: mD6rxHPWOGvBkQWkoyfDUO7/L2iZ7OJ3VYYZCwDlY0U=

jobs:
  linux:
    name: Linux bundles
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file libssl-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libfuse2

      - name: Install dependencies
        run: npm ci

      - name: Build Linux bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --bundles deb,appimage

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p release
          VERSION="${VERSION#v}"
          cp target/release/bundle/deb/*.deb "release/BITS-AI-Video-Creator_${VERSION}_amd64.deb"
          cp target/release/bundle/deb/*.sig "release/BITS-AI-Video-Creator_${VERSION}_amd64.deb.sig"
          cp target/release/bundle/appimage/*.AppImage "release/BITS-AI-Video-Creator_${VERSION}_amd64.AppImage"
          cp target/release/bundle/appimage/*.sig "release/BITS-AI-Video-Creator_${VERSION}_amd64.AppImage.sig"
          ls -lh release

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bits-ai-video-creator-linux
          path: release/*
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: npm ci

      - name: Build NSIS installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --bundles nsis

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          VERSION="${VERSION#v}"
          cp target/release/bundle/nsis/*.exe "release/BITS-AI-Video-Creator_${VERSION}_x64-setup.exe"
          EXE_SIG=$(find target/release/bundle/nsis -maxdepth 1 -name '*.exe.sig' | head -1)
          test -n "$EXE_SIG"
          cp "$EXE_SIG" "release/BITS-AI-Video-Creator_${VERSION}_x64-setup.exe.sig"
          ls -lh release

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bits-ai-video-creator-windows
          path: release/*
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android signed APK and AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          sdkmanager "ndk;29.0.14206865" || sdkmanager "ndk;28.2.13676358"
          NDK_DIR=$(find "$ANDROID_HOME/ndk" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Install Rust toolchain and Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: android-aarch64

      - name: Install dependencies
        run: npm ci

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/bits-ai-video-creator-release.jks"
          cat > src-tauri/gen/android/keystore.properties <<EOF
          password=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=${ANDROID_KEY_ALIAS:-bits-ai-video-creator}
          storeFile=$RUNNER_TEMP/bits-ai-video-creator-release.jks
          EOF
          chmod 600 src-tauri/gen/android/keystore.properties

      - name: Build signed APK
        run: npx tauri android build --apk --target aarch64 --ci

      - name: Build signed AAB
        run: npx tauri android build --aab --target aarch64 --ci

      - name: Verify signatures and collect artifacts
        run: |
          set -o pipefail
          mkdir -p release
          VERSION="${VERSION#v}"
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)
          AAB=$(find src-tauri/gen/android/app/build/outputs/bundle -name '*.aab' | head -1)
          test -n "$APK"
          test -n "$AAB"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee release/apk-signature.txt
          jarsigner -verify "$AAB" | tee release/aab-signature.txt
          keytool -printcert -jarfile "$AAB" | tee -a release/aab-signature.txt
          cp "$APK" "release/BITS-AI-Video-Creator_${VERSION}_universal.apk"
          cp "$AAB" "release/BITS-AI-Video-Creator_${VERSION}_release.aab"
          ls -lh release

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bits-ai-video-creator-android
          path: release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs: [linux, windows, android]
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Generate updater manifest and checksums
        env:
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
          VERSION: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import glob
          import json
          import os
          import sys
          from datetime import datetime, timezone

          version = os.environ["VERSION"].removeprefix("v")
          tag = os.environ["TAG_NAME"]
          base = f"https://github.com/Banten-IT-Solutions/BITS-AI-Video-Creator/releases/download/{tag}"

          def artifact(pattern):
              matches = sorted(glob.glob(f"release/{pattern}"))
              return matches[0] if matches else None

          def entry(pattern):
              path = artifact(pattern)
              if not path:
                  return None
              sig = path + ".sig"
              if not os.path.exists(sig):
                  print(f"missing signature for {path}", file=sys.stderr)
                  sys.exit(1)
              return {
                  "signature": open(sig, encoding="utf-8").read().strip(),
                  "url": f"{base}/{os.path.basename(path)}",
              }

          platforms = {}
          for key, pattern in (
              ("linux-x86_64-appimage", "BITS-AI-Video-Creator_*_amd64.AppImage"),
              ("linux-x86_64-deb", "BITS-AI-Video-Creator_*_amd64.deb"),
              ("windows-x86_64-nsis", "BITS-AI-Video-Creator_*_x64-setup.exe"),
          ):
              value = entry(pattern)
              if value:
                  platforms[key] = value

          required = {"linux-x86_64-appimage", "windows-x86_64-nsis"}
          missing = required - platforms.keys()
          if missing:
              print(f"missing updater platforms: {sorted(missing)}", file=sys.stderr)
              sys.exit(1)

          notes = open("docs/RELEASE_NOTES_1.0.0.md", encoding="utf-8").read()
          manifest = {
              "version": version,
              "notes": notes,
              "pub_date": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }
          with open("release/latest.json", "w", encoding="utf-8") as handle:
              json.dump(manifest, handle, indent=2)
              handle.write("\n")
          print(json.dumps(manifest, indent=2))
          PY
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release/* --clobber
          else
            gh release create "$TAG_NAME" \
              --title "BITS AI Video Creator ${TAG_NAME#v}" \
              --notes-file docs/RELEASE_NOTES_1.0.0.md \
              release/*
          fi
