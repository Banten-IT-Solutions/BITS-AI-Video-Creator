name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG_NAME: ${{ inputs.tag || github.ref_name }}
  VERSION: ${{ inputs.tag || github.ref_name }}

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Check out the requested tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Validate tag and checked-out commit
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          TAG="${TAG_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag '$TAG': expected vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          if ! git rev-parse --verify "refs/tags/${TAG}^{commit}" >/dev/null 2>&1; then
            echo "Tag '$TAG' does not exist in the repository." >&2
            exit 1
          fi
          TAG_COMMIT="$(git rev-list -n1 "$TAG")"
          HEAD_COMMIT="$(git rev-parse HEAD)"
          if [[ "$TAG_COMMIT" != "$HEAD_COMMIT" ]]; then
            echo "Checked-out commit $HEAD_COMMIT does not match tag $TAG ($TAG_COMMIT)." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify source before packaging
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the validated tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file libssl-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace

  audit:
    name: Dependency audit
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - name: Check out the validated tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Audit Rust dependencies
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  linux:
    name: Linux bundles
    needs: [validate, verify]
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out the validated tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false

      - name: Pin license public key from BITS License Manager
        run: |
          PUBKEY="$(curl -fsSL --retry 3 https://license.bits.co.id/api/v1/meta/license-pubkey | jq -er '.data.publicKey | select(length >= 43 and length <= 44)')"
          echo "BITS_LICENSE_PUBKEY=$PUBKEY" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file libssl-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libfuse2

      - name: Install dependencies
        run: npm ci

      - name: Align release version
        run: node scripts/set-release-version.mjs "${{ needs.validate.outputs.version }}"

      - name: Build Linux bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --bundles deb,appimage

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p release
          VERSION="${VERSION#v}"
          cp target/release/bundle/deb/*.deb "release/BITS-AI-Video-Creator_${VERSION}_amd64.deb"
          cp target/release/bundle/deb/*.sig "release/BITS-AI-Video-Creator_${VERSION}_amd64.deb.sig"
          cp target/release/bundle/appimage/*.AppImage "release/BITS-AI-Video-Creator_${VERSION}_amd64.AppImage"
          cp target/release/bundle/appimage/*.sig "release/BITS-AI-Video-Creator_${VERSION}_amd64.AppImage.sig"
          ls -lh release

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bits-ai-video-creator-linux
          path: release/*
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows installer
    needs: [validate, verify]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out the validated tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false

      - name: Pin license public key from BITS License Manager
        shell: bash
        run: |
          PUBKEY="$(curl -fsSL --retry 3 https://license.bits.co.id/api/v1/meta/license-pubkey | jq -er '.data.publicKey | select(length >= 43 and length <= 44)')"
          echo "BITS_LICENSE_PUBKEY=$PUBKEY" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: npm ci

      - name: Align release version
        run: node scripts/set-release-version.mjs "${{ needs.validate.outputs.version }}"

      - name: Build NSIS installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --bundles nsis

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          VERSION="${VERSION#v}"
          cp target/release/bundle/nsis/*.exe "release/BITS-AI-Video-Creator_${VERSION}_x64-setup.exe"
          EXE_SIG=$(find target/release/bundle/nsis -maxdepth 1 -name '*.exe.sig' | head -1)
          test -n "$EXE_SIG"
          cp "$EXE_SIG" "release/BITS-AI-Video-Creator_${VERSION}_x64-setup.exe.sig"
          ls -lh release

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bits-ai-video-creator-windows
          path: release/*
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android signed APK and AAB
    needs: [validate, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the validated tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false

      - name: Pin license public key from BITS License Manager
        run: |
          PUBKEY="$(curl -fsSL --retry 3 https://license.bits.co.id/api/v1/meta/license-pubkey | jq -er '.data.publicKey | select(length >= 43 and length <= 44)')"
          echo "BITS_LICENSE_PUBKEY=$PUBKEY" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          sdkmanager "ndk;29.0.14206865" || sdkmanager "ndk;28.2.13676358"
          NDK_DIR=$(find "$ANDROID_HOME/ndk" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Install Rust toolchain and Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: android-aarch64

      - name: Install dependencies
        run: npm ci

      - name: Align release version
        run: node scripts/set-release-version.mjs "${{ needs.validate.outputs.version }}"

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/bits-ai-video-creator-release.jks"
          cat > src-tauri/gen/android/keystore.properties <<EOF
          password=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=${ANDROID_KEY_ALIAS:-bits-ai-video-creator}
          storeFile=$RUNNER_TEMP/bits-ai-video-creator-release.jks
          EOF
          chmod 600 src-tauri/gen/android/keystore.properties

      - name: Build signed APK
        run: npx tauri android build --apk --target aarch64 --ci

      - name: Build signed AAB
        run: npx tauri android build --aab --target aarch64 --ci

      - name: Verify signatures and collect artifacts
        run: |
          set -o pipefail
          mkdir -p release
          VERSION="${VERSION#v}"
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)
          AAB=$(find src-tauri/gen/android/app/build/outputs/bundle -name '*.aab' | head -1)
          test -n "$APK"
          test -n "$AAB"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee release/apk-signature.txt
          jarsigner -verify "$AAB" | tee release/aab-signature.txt
          keytool -printcert -jarfile "$AAB" | tee -a release/aab-signature.txt
          cp "$APK" "release/BITS-AI-Video-Creator_${VERSION}_universal.apk"
          cp "$AAB" "release/BITS-AI-Video-Creator_${VERSION}_release.aab"
          ls -lh release

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bits-ai-video-creator-android
          path: release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [validate, verify, audit, linux, windows, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out the validated tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Generate updater manifest and checksums
        env:
          TAG_NAME: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          python3 - <<'PY'
          import glob
          import json
          import os
          import sys
          from datetime import datetime, timezone

          version = os.environ["VERSION"]
          tag = os.environ["TAG_NAME"]
          base = f"https://github.com/Banten-IT-Solutions/BITS-AI-Video-Creator/releases/download/{tag}"

          def artifact(pattern):
              matches = sorted(glob.glob(f"release/{pattern}"))
              return matches[0] if matches else None

          def entry(pattern):
              path = artifact(pattern)
              if not path:
                  return None
              sig = path + ".sig"
              if not os.path.exists(sig):
                  print(f"missing signature for {path}", file=sys.stderr)
                  sys.exit(1)
              return {
                  "signature": open(sig, encoding="utf-8").read().strip(),
                  "url": f"{base}/{os.path.basename(path)}",
              }

          platforms = {}
          for key, pattern in (
              ("linux-x86_64-appimage", "BITS-AI-Video-Creator_*_amd64.AppImage"),
              ("linux-x86_64-deb", "BITS-AI-Video-Creator_*_amd64.deb"),
              ("windows-x86_64-nsis", "BITS-AI-Video-Creator_*_x64-setup.exe"),
          ):
              value = entry(pattern)
              if value:
                  platforms[key] = value

          required = {"linux-x86_64-appimage", "windows-x86_64-nsis"}
          missing = required - platforms.keys()
          if missing:
              print(f"missing updater platforms: {sorted(missing)}", file=sys.stderr)
              sys.exit(1)

          # Release notes are version-specific. Never fall back to a previous
          # version's notes; use a short generated note when no file exists.
          notes_candidates = (
              f"docs/RELEASE_NOTES_{version}.md",
              "docs/RELEASE_NOTES.md",
          )
          notes = next(
              (open(path, encoding="utf-8").read() for path in notes_candidates if os.path.exists(path)),
              f"BITS AI Video Creator {version}.\n\nSee the asset checksums and signatures attached to this release.",
          )
          with open("release/notes.md", "w", encoding="utf-8") as handle:
              handle.write(notes)

          manifest = {
              "version": version,
              "notes": notes,
              "pub_date": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }
          with open("release/latest.json", "w", encoding="utf-8") as handle:
              json.dump(manifest, handle, indent=2)
              handle.write("\n")
          print(json.dumps(manifest, indent=2))
          PY
          cd release
          # Build the checksum list without the output file itself: shell
          # redirection creates SHA256SUMS.txt before the glob expands, so
          # `sha256sum *` would hash an empty file and record a wrong entry.
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -printf '%P\n' \
            | sort \
            | xargs -r sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          PRERELEASE_FLAGS=()
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE_FLAGS=(--prerelease --latest=false)
          fi
          ASSETS=(release/BITS-* release/latest.json release/SHA256SUMS.txt)
          if compgen -G "release/*signature*.txt" >/dev/null; then
            ASSETS+=(release/*signature*.txt)
          fi
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${ASSETS[@]}" --clobber
            gh release edit "$TAG_NAME" --notes-file release/notes.md "${PRERELEASE_FLAGS[@]}"
          else
            gh release create "$TAG_NAME" \
              --title "BITS AI Video Creator ${TAG_NAME#v}" \
              --notes-file release/notes.md \
              "${PRERELEASE_FLAGS[@]}" \
              "${ASSETS[@]}"
          fi
