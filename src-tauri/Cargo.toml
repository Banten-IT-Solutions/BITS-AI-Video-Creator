[package]
name = "bits-ai-video-creator"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "BITS AI Video Creator — Storyboard, voiceover, and AI video production studio"

[lib]
name = "bits_ai_video_creator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bits-ai-video-creator-core = { path = "../crates/bits-ai-video-creator-core" }
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
tokio.workspace = true
url = "2"

[target.'cfg(not(target_os = "android"))'.dependencies]
tauri-plugin-single-instance = "2"
# The v1 compressed-bundle support (`zip` feature) is unused: this app ships
# Tauri v2 bundles. Disabling it drops the vulnerable `zip` 4.x dependency.
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
keyring = { version = "4", features = ["v1"] }

[target.'cfg(target_os = "android")'.dependencies]
keyring-core = "1"
android-native-keyring-store = "1"
